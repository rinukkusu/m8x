name: Docker images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# A second push to the same branch makes the first build irrelevant.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck and tests gate the images. They take under a minute between them,
  # and publishing a :latest that does not compile is the thing this prevents.
  checks:
    name: Typecheck and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The Prisma client is generated rather than committed, and the types it
      # produces are what the server code is checked against.
      - name: Generate the Prisma client
        run: npx prisma generate --schema packages/core/prisma/schema.prisma

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  build:
    name: Build web and worker
    runs-on: ubuntu-latest
    needs: checks

    permissions:
      contents: read
      packages: write

    # Both images come from one Dockerfile and share its `base` stage, which
    # installs every dependency and generates the Prisma client. Building them
    # in a single job rather than a matrix means that stage is built once and
    # the second image reuses it from the local layer cache. A matrix would run
    # the expensive part twice in parallel and cache it twice.
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Pull requests build but never publish. A fork's token cannot write
      # packages anyway, and an unreviewed change should not become :latest.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels for web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Tags and labels for worker
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-worker
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=m8x
          cache-to: type=gha,mode=max,scope=m8x

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          # Same cache scope as web on purpose: the shared base stage is by far
          # the most expensive part, and both images want the same entries.
          cache-from: type=gha,scope=m8x
          cache-to: type=gha,mode=max,scope=m8x
